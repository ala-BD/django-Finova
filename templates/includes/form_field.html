<div class="field">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}
        {% if field.field.required %}
            <span class="required" aria-hidden="true">*</span>
            <span class="visually-hidden">obligatoire</span>
        {% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
        <p class="help" id="{{ field.id_for_label }}-help">{{ field.help_text }}</p>
    {% endif %}
    {% if field.errors %}
        <p class="field-error" id="{{ field.id_for_label }}-error" role="alert">
            {{ field.errors.0 }}
        </p>
    {% endif %}
</div>
