services:
  - type: web
    name: finova
    runtime: python
    # migrate à chaque déploiement : sinon la base PostgreSQL reste vide et toutes les pages plantent
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --no-input
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: finova-db
          property: connectionString
      - key: LLM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EXCHANGE_RATE_API_URL
        value: https://open.er-api.com/v6/latest/{base}

databases:
  - name: finova-db
    plan: free
